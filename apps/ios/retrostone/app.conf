# RetroStone for iPhone and iPad: the one free app, as on Google Play (apps/android/app-retrostone.conf): the board
# games of apps/boardgames and the Arcade's games in their tab, every game and every level free, nothing sold. Read by
# apps/ios/prepare.sh and apps/ios/build.sh. Plain KEY=value lines, no quotes; '#' starts a comment line.
#
# BUNDLE_ID is PERMANENT once the app is on the App Store (App Store Connect: the app's bundle id). The same id as the
# Android app: the two stores are separate. A fork built under another Apple Developer team uses its own.

APP_NAME=RetroStone
BUNDLE_ID=com.eightbcraft.retrostone
# the app's numeric id on the App Store (App Store Connect, App Information: Apple ID), for Settings, Leave a
# review; empty: no such row
APPSTORE_ID=
# the save folder (SDL_GetPrefPath: Library/Application Support/8BCraft/<EXE_NAME>) and the Xcode target's name
EXE_NAME=RetroStone
# the edition: the Android app's .conf (its games, its Arcade tab, its Settings page's links, its icon, its version);
# what is the Play Store's in it (the review page, the tips through Google Play Billing) is left out
EDITION_FROM=apps/android/app-retrostone.conf
